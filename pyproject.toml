[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidence-index-verification"
version = "0.1.0"
description = "Independently verify The Road to Autonomy Confidence Indices: integrity and timing of every published reading."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AUTNMY AI, Inc." }]
keywords = ["merkle", "rfc3161", "timestamp", "verification", "transparency", "autonomy", "confidence", "indices"]
dependencies = [
  "rfc8785==0.1.4",
  "rfc3161-client==1.0.6",
  "cryptography>=42",
]

[project.scripts]
confidence-verify = "confidence_verification.cli:main"

[project.urls]
Source = "https://github.com/AUTNMY-AI/confidence-index-verification"

[tool.setuptools]
packages = ["confidence_verification"]
